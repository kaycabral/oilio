version: 2
updates:
  # pnpm workspace: run from the root only. The root job reads
  # pnpm-workspace.yaml and updates every workspace package.json (and the
  # catalog) together with pnpm-lock.yaml; per-workspace directories never see
  # the root lockfile, so their PRs fail `pnpm install --frozen-lockfile`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      cbrl-toolkit:
        patterns:
          - '@cbrl/*'
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@cbrl/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
