# Dependabot template for apps that consume @cbrl/*. Copy to the app's
# .github/dependabot.yml unchanged: patterns that match no dependency are inert,
# so the `critical` list can stay shared across apps.
version: 2
updates:
  # Single package at the root: package.json + pnpm-lock.yaml (pnpm-workspace.yaml
  # holds only pnpm settings).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    # Supply-chain quarantine: a compromised release is usually yanked within
    # hours; never propose a version younger than this. Security updates skip it.
    cooldown:
      default-days: 3
      semver-major-days: 7
      exclude:
        - '@cbrl/*'
    commit-message:
      prefix: chore
      include: scope
    # Majors blocked by a peer of @cbrl/eslint-config. Remove each entry once
    # its blocker supports the new major (tracked in kaycabral/toolkit#35):
    #   - typescript >= 7: typescript-eslint peers `typescript <6.1`.
    #   - eslint >= 10: eslint-plugin-jsx-a11y peers `eslint` up to ^9.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
      - dependency-name: eslint
        versions: ['>=10']
    # Groups drive auto-merge (dependabot-auto-merge.yml): `minor-and-patch` and
    # the `actions` group below merge by themselves. `critical` holds what CI can't fully prove (payments, auth,
    # database, framework, error reporting) and waits for a human, as do
    # `cbrl-toolkit`, majors and security updates (ungrouped).
    groups:
      cbrl-toolkit:
        patterns:
          - '@cbrl/*'
      critical:
        update-types:
          - minor
          - patch
        patterns:
          - next
          - stripe
          - '@supabase/*'
          - supabase
          - drizzle-orm
          - drizzle-kit
          - pg
          - '@sentry/*'
          - effect
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@cbrl/*'
          - next
          - stripe
          - '@supabase/*'
          - supabase
          - drizzle-orm
          - drizzle-kit
          - pg
          - '@sentry/*'
          - effect

  # `/` only covers .github/workflows; composite actions live under
  # .github/actions and must be listed or their pins silently drift.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types:
          - minor
          - patch
        patterns:
          - '*'

  # Test infrastructure images (stripe-mock, the integration Postgres). Ungrouped,
  # so each bump waits for a human; the E2E and integration jobs prove it.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
