# Merges the Dependabot groups CI can prove (minor-and-patch, actions) once the
# PR gate is green, then starts main.yml. See the reusable workflow for why.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Pull request]
    types: [completed]

permissions: {}

jobs:
  merge:
    name: Merge
    uses: kaycabral/toolkit/.github/workflows/dependabot-auto-merge.yml@bbf51e77698631fd010739c2f40a0061d24e6819 # main
    permissions:
      contents: write
      pull-requests: write
      actions: write
