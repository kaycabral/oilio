# Merges the Dependabot groups CI can prove (minor-and-patch, actions) once the
# PR gate is green, then starts main.yml. See the reusable workflow for why.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Pull request]
    types: [completed]

permissions: {}

jobs:
  merge:
    name: Merge
    uses: kaycabral/toolkit/.github/workflows/dependabot-auto-merge.yml@8ad6e870af4908070e9d826a03638b149003f06b # ci/dependabot-rebase (bump to main after toolkit#72 merges)
    permissions:
      contents: write
      pull-requests: write
      actions: write
