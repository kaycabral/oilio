# Merges the Dependabot groups CI can prove (minor-and-patch, actions) once the
# PR gate is green, then starts main.yml. See the reusable workflow for why.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Pull request]
    types: [completed]

permissions: {}

jobs:
  merge:
    name: Merge
    uses: kaycabral/toolkit/.github/workflows/dependabot-auto-merge.yml@9c5c2ac51e3a3fc366c2147141c6abbec98ddfb4 # main
    permissions:
      contents: write
      pull-requests: write
      actions: write
