name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly full E2E suite (PRs and main run the @critical subset).
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # PR runs are disposable; a run on main may be applying production
  # migrations and must never be killed halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Native constraints, RLS and the event store against a real (plain, ephemeral)
  # Postgres. Each suite creates its own database and runtime role.
  integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Product base + oilio gate
        run: pnpm test:integration
      - name: Event store
        run: pnpm --filter @oilio/web run test:integration

  # Migration hygiene: journals consistent, schema changes ship with their
  # generated migration, and migrations already on main are never edited
  # (production has applied them; fix forward with a new one).
  migrations:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # drizzle.config.ts requires a URL; check/generate never connect.
      OILIO_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm --filter @oilio/web exec drizzle-kit check
      - run: pnpm --filter @oilio/product exec drizzle-kit check
      - name: Schema changes ship with their migration
        run: |
          pnpm --filter @oilio/web run db:generate
          pnpm --filter @oilio/product exec drizzle-kit generate
          if [ -n "$(git status --porcelain apps/web/drizzle packages/product/drizzle)" ]; then
            git status --porcelain apps/web/drizzle packages/product/drizzle
            echo "::error::A Drizzle schema changed without its migration. Run 'db:generate' and commit the drizzle/ folder."
            exit 1
          fi
      - name: Migrations on main are immutable
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          edited=$(git diff --name-only --diff-filter=MDR "origin/${BASE_REF}...HEAD" -- \
            'apps/web/drizzle/*.sql' 'apps/web/drizzle/meta/*_snapshot.json' \
            'packages/product/drizzle/*.sql' 'packages/product/drizzle/meta/*_snapshot.json')
          if [ -n "$edited" ]; then
            echo "$edited"
            echo "::error::Migrations already on ${BASE_REF} were edited, renamed or deleted. Add a new migration instead."
            exit 1
          fi

  # Playwright against the LOCAL Supabase stack, on the production build. The
  # app under test connects as `oilio_app` (no BYPASSRLS), exactly as in
  # production. @critical on PRs and main; the whole suite nightly.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PW_WORKERS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @oilio/web run db:start
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @oilio/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @oilio/web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @oilio/web exec playwright install-deps chromium
      - name: Critical suite
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: pnpm --filter @oilio/web run test:e2e:critical
      - name: Full suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm --filter @oilio/web run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  # Production schema rollout. Runs only on a push to main, only after every
  # check above is green, inside the `production` environment (its secret is
  # unreachable from any other branch). Idempotent: with nothing pending it is
  # a no-op, so it runs on every push and Vercel gates production promotion on
  # it (Deployment Checks). `always()` matters: a job skipped because a
  # dependency failed reports "skipped", which Deployment Checks treat as
  # passing; failing explicitly turns any red check into a blocked promotion.
  migrate-production:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, integration, migrations, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Every required check passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A required job did not succeed; production is not migrated and the deploy must not be promoted."
          exit 1
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Apply pending migrations
        env:
          # Supabase session pooler (port 5432) as `postgres`: IPv4-reachable
          # from the runners and it supports the migrator's advisory lock (the
          # 6543 transaction pooler does not).
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: pnpm --filter @oilio/web run db:migrate
