# Every quality gate, as one reusable pipeline. Callers own the trigger and the
# concurrency policy: pull-request.yml (every PR), main.yml (fallback when a push
# to main was not proven by a PR) and nightly.yml (drift on an unchanged main).
# All jobs run in parallel; the slowest one (E2E) sets the wall-clock.
name: Checks

on:
  workflow_call:

permissions: {}

jobs:
  static:
    name: Static (format · lint · types · migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # drizzle.config.ts requires a URL; check/generate never connect.
      OILIO_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migration journals are consistent
        run: |
          pnpm --filter @oilio/web exec drizzle-kit check
          pnpm --filter @oilio/product exec drizzle-kit check
      - name: Schema changes ship with their migration
        run: |
          pnpm --filter @oilio/web run db:generate
          pnpm --filter @oilio/product exec drizzle-kit generate
          if [ -n "$(git status --porcelain apps/web/drizzle packages/product/drizzle)" ]; then
            git status --porcelain apps/web/drizzle packages/product/drizzle
            echo "::error::A Drizzle schema changed without its migration. Run 'db:generate' and commit the drizzle/ folder."
            exit 1
          fi
      # Production has applied every migration on main: fix forward, never edit.
      - name: Migrations on main are immutable
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          edited=$(git diff --name-only --diff-filter=MDR "origin/${BASE_REF}...HEAD" -- \
            'apps/web/drizzle/*.sql' 'apps/web/drizzle/meta/*_snapshot.json' \
            'packages/product/drizzle/*.sql' 'packages/product/drizzle/meta/*_snapshot.json')
          if [ -n "$edited" ]; then
            echo "$edited"
            echo "::error::Migrations already on ${BASE_REF} were edited, renamed or deleted. Add a new migration instead."
            exit 1
          fi

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  # Native constraints, RLS and the event store against a real, ephemeral
  # Postgres (docker/postgres.compose.yaml). Each suite owns its database.
  integration:
    name: Integration (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: product
            run: pnpm test:integration
          - name: event store
            run: pnpm --filter @oilio/web run test:integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: ${{ matrix.suite.run }}

  # The whole Playwright suite against the LOCAL Supabase stack, on the
  # production build, sharded. The app under test connects as `oilio_app` (no
  # BYPASSRLS), exactly as in production. 4 shards x 3 workers keeps a PR at
  # ~10 jobs, inside the account's 20 concurrent jobs with room for a second PR.
  e2e:
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PW_WORKERS: '3'
      PW_SHARD_TOTAL: '4'
      PW_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @oilio/web run db:start
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @oilio/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @oilio/web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @oilio/web exec playwright install-deps chromium
      - run: pnpm --filter @oilio/web run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7
