# Every quality gate, as one reusable pipeline. Callers own the trigger and the
# concurrency policy: pull-request.yml (every PR), main.yml (fallback when a push
# to main was not proven by a PR) and nightly.yml (drift on an unchanged main).
# All jobs run in parallel; the slowest one (E2E) sets the wall-clock.
name: Checks

on:
  workflow_call:

permissions: {}

jobs:
  static:
    name: Static (format · lint · types · migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # drizzle.config.ts requires a URL; check/generate never connect.
      OILIO_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: kaycabral/toolkit/.github/actions/setup@0dd0a4fa17c44d7ac401f8cc96bd0c4615cb56c1 # main
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - uses: kaycabral/toolkit/.github/actions/drizzle-migrations@0dd0a4fa17c44d7ac401f8cc96bd0c4615cb56c1 # main
        with:
          folders: apps/web/drizzle packages/product/drizzle
          check: |
            pnpm --filter @oilio/web exec drizzle-kit check
            pnpm --filter @oilio/product exec drizzle-kit check
          generate: |
            pnpm --filter @oilio/web run db:generate
            pnpm --filter @oilio/product exec drizzle-kit generate

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kaycabral/toolkit/.github/actions/setup@0dd0a4fa17c44d7ac401f8cc96bd0c4615cb56c1 # main
      - run: pnpm test

  # Native constraints, RLS and the event store against a real, ephemeral
  # Postgres (docker/postgres.compose.yaml). Each suite owns its database.
  integration:
    name: Integration (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: product
            run: pnpm test:integration
          - name: event store
            run: pnpm --filter @oilio/web run test:integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kaycabral/toolkit/.github/actions/setup@0dd0a4fa17c44d7ac401f8cc96bd0c4615cb56c1 # main
      - run: ${{ matrix.suite.run }}

  # The whole Playwright suite against the LOCAL Supabase stack, on the
  # production build, sharded. The app under test connects as `oilio_app` (no
  # BYPASSRLS), exactly as in production. 4 shards x 3 workers keeps a PR at
  # ~10 jobs, inside the account's 20 concurrent jobs with room for a second PR.
  #
  # Shards are balanced by duration: `e2e-timings` caches per-spec durations
  # from main, and each shard takes its slice of the specs, heaviest first, so
  # the shards finish together. Without timings, Playwright's count-based split.
  e2e:
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PW_WORKERS: '3'
      SHARD: ${{ matrix.shard }}
      SHARDS: '4'
    steps:
      # The local Supabase stack binds fixed host ports inside Linux's default
      # ephemeral range (32768-60999). Outbound connections (checkout, installs,
      # image pulls) can take one as a source port, also while in TIME_WAIT, and
      # Docker then fails with "address already in use". Move the ephemeral
      # range above them before the job opens any connection.
      - name: Keep ephemeral ports clear of the local Supabase stack
        run: sudo sysctl -w net.ipv4.ip_local_port_range="61000 65535"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kaycabral/toolkit/.github/actions/setup@0dd0a4fa17c44d7ac401f8cc96bd0c4615cb56c1 # main
      # `supabase start` intermittently restarts the db container and then fails
      # to bind its host port ("address already in use"), occasionally on several
      # shards at once. Tear the stack down and start once more before failing.
      - name: Start the local Supabase stack
        run: |
          if ! pnpm --filter @oilio/web run db:start; then
            echo "::warning::supabase start failed; tearing the stack down and retrying once."
            pnpm --filter @oilio/web exec supabase stop --no-backup --workdir .
            pnpm --filter @oilio/web run db:start
          fi
      - uses: kaycabral/toolkit/.github/actions/playwright@0dd0a4fa17c44d7ac401f8cc96bd0c4615cb56c1 # main
        with:
          working-directory: apps/web
      - name: Restore spec timings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e-timings.json
          key: e2e-timings-${{ github.run_id }}
          restore-keys: e2e-timings-
      - name: Run shard
        working-directory: apps/web
        env:
          TIMINGS: ${{ runner.temp }}/e2e-timings.json
          PW_JSON_REPORT: ${{ runner.temp }}/e2e-report.json
        run: |
          if specs=$(node scripts/e2e-shards.ts plan "$TIMINGS" "$SHARD" "$SHARDS"); then
            mapfile -t files <<<"$specs"
            echo "Duration-balanced shard: ${#files[@]} spec files"
            pnpm run test:e2e "${files[@]}"
          else
            echo "No spec timings yet: count-based sharding"
            PW_SHARD_TOTAL="$SHARDS" PW_SHARD_INDEX="$SHARD" pnpm run test:e2e
          fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-report.json
          if-no-files-found: ignore
          retention-days: 1

  # Records per-spec durations for the next runs to balance on. Off on PRs: it
  # would add its runtime to the PR's wall-clock, and a PR's cache is visible
  # only to that PR, while main's (nightly) is visible to every PR.
  e2e-timings:
    name: E2E timings
    needs: e2e
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            apps/web/scripts
            apps/web/tests/e2e
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-report-*
          path: ${{ runner.temp }}/reports
      - name: Merge spec timings
        id: merge
        working-directory: apps/web
        env:
          REPORTS: ${{ runner.temp }}/reports
          TIMINGS: ${{ runner.temp }}/e2e-timings.json
        run: |
          shopt -s nullglob
          reports=("$REPORTS"/*/e2e-report.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::warning::No E2E report to learn timings from."
            exit 0
          fi
          node scripts/e2e-shards.ts record "$TIMINGS" "${reports[@]}"
          echo "recorded=true" >> "$GITHUB_OUTPUT"
      - if: steps.merge.outputs.recorded == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e-timings.json
          key: e2e-timings-${{ github.run_id }}
