# Every quality gate, as one reusable pipeline. Callers own the trigger and the
# concurrency policy: pull-request.yml (every PR), main.yml (fallback when a push
# to main was not proven by a PR) and nightly.yml (drift on an unchanged main).
# All jobs run in parallel; the slowest one (E2E) sets the wall-clock.
name: Checks

on:
  workflow_call:

permissions: {}

jobs:
  static:
    name: Static (format · lint · types · migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # drizzle.config.ts requires a URL; check/generate never connect.
      OILIO_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migration journals are consistent
        run: |
          pnpm --filter @oilio/web exec drizzle-kit check
          pnpm --filter @oilio/product exec drizzle-kit check
      - name: Schema changes ship with their migration
        run: |
          pnpm --filter @oilio/web run db:generate
          pnpm --filter @oilio/product exec drizzle-kit generate
          if [ -n "$(git status --porcelain apps/web/drizzle packages/product/drizzle)" ]; then
            git status --porcelain apps/web/drizzle packages/product/drizzle
            echo "::error::A Drizzle schema changed without its migration. Run 'db:generate' and commit the drizzle/ folder."
            exit 1
          fi
      # Production has applied every migration on main: fix forward, never edit.
      - name: Migrations on main are immutable
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          edited=$(git diff --name-only --diff-filter=MDR "origin/${BASE_REF}...HEAD" -- \
            'apps/web/drizzle/*.sql' 'apps/web/drizzle/meta/*_snapshot.json' \
            'packages/product/drizzle/*.sql' 'packages/product/drizzle/meta/*_snapshot.json')
          if [ -n "$edited" ]; then
            echo "$edited"
            echo "::error::Migrations already on ${BASE_REF} were edited, renamed or deleted. Add a new migration instead."
            exit 1
          fi

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  # Native constraints, RLS and the event store against a real, ephemeral
  # Postgres (docker/postgres.compose.yaml). Each suite owns its database.
  integration:
    name: Integration (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: product
            run: pnpm test:integration
          - name: event store
            run: pnpm --filter @oilio/web run test:integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: ${{ matrix.suite.run }}

  # The whole Playwright suite against the LOCAL Supabase stack, on the
  # production build, sharded. The app under test connects as `oilio_app` (no
  # BYPASSRLS), exactly as in production. 4 shards x 3 workers keeps a PR at
  # ~10 jobs, inside the account's 20 concurrent jobs with room for a second PR.
  #
  # Shards are balanced by duration: `e2e-timings` caches per-spec durations
  # from main, and each shard takes its slice of the specs, heaviest first, so
  # the shards finish together. Without timings, Playwright's count-based split.
  e2e:
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PW_WORKERS: '3'
      SHARD: ${{ matrix.shard }}
      SHARDS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @oilio/web run db:start
      - name: Resolve Playwright version and OS release
        id: playwright
        run: |
          echo "version=$(pnpm --filter @oilio/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "os=${ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @oilio/web exec playwright install chromium
      # The browser's system packages, as .deb files: `install-deps` goes through
      # apt and the Ubuntu mirrors on every shard (once took 6 min on a slow
      # mirror). Keyed by OS release + Playwright, not by runner image version: the
      # image rolls out gradually, so shards of one run land on different versions
      # and a per-version key would miss. A hit installs them offline.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: system-debs
        with:
          path: ~/.cache/playwright-debs
          key: playwright-debs-${{ steps.playwright.outputs.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser system packages
        env:
          CACHED: ${{ steps.system-debs.outputs.cache-hit }}
        run: |
          debs="$HOME/.cache/playwright-debs"
          if [ "$CACHED" = 'true' ]; then
            shopt -s nullglob
            files=("$debs"/*.deb)
            echo "Installing ${#files[@]} cached packages offline"
            if ! sudo dpkg -i "${files[@]}"; then
              echo "::warning::Cached packages did not install; falling back to apt."
              pnpm --filter @oilio/web exec playwright install-deps chromium
            fi
          else
            echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-keep-debs >/dev/null
            sudo rm -f /etc/apt/apt.conf.d/docker-clean
            sudo apt-get clean
            pnpm --filter @oilio/web exec playwright install-deps chromium
            mkdir -p "$debs"
            find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} "$debs"/ \;
            count=$(find "$debs" -name '*.deb' | wc -l)
            if [ "$count" -eq 0 ]; then
              rm -rf "$debs"
              echo "::warning::No .deb kept by apt; nothing cached, next runs use apt again."
            else
              echo "Cached $count packages for the next runs"
            fi
          fi
      - name: Restore spec timings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e-timings.json
          key: e2e-timings-${{ github.run_id }}
          restore-keys: e2e-timings-
      - name: Run shard
        working-directory: apps/web
        env:
          TIMINGS: ${{ runner.temp }}/e2e-timings.json
          PW_JSON_REPORT: ${{ runner.temp }}/e2e-report.json
        run: |
          if specs=$(node scripts/e2e-shards.ts plan "$TIMINGS" "$SHARD" "$SHARDS"); then
            mapfile -t files <<<"$specs"
            echo "Duration-balanced shard: ${#files[@]} spec files"
            pnpm run test:e2e "${files[@]}"
          else
            echo "No spec timings yet: count-based sharding"
            PW_SHARD_TOTAL="$SHARDS" PW_SHARD_INDEX="$SHARD" pnpm run test:e2e
          fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-report.json
          if-no-files-found: ignore
          retention-days: 1

  # Records per-spec durations for the next runs to balance on. Off on PRs: it
  # would add its runtime to the PR's wall-clock, and a PR's cache is visible
  # only to that PR, while main's (nightly) is visible to every PR.
  e2e-timings:
    name: E2E timings
    needs: e2e
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            apps/web/scripts
            apps/web/tests/e2e
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-report-*
          path: ${{ runner.temp }}/reports
      - name: Merge spec timings
        id: merge
        working-directory: apps/web
        env:
          REPORTS: ${{ runner.temp }}/reports
          TIMINGS: ${{ runner.temp }}/e2e-timings.json
        run: |
          shopt -s nullglob
          reports=("$REPORTS"/*/e2e-report.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::warning::No E2E report to learn timings from."
            exit 0
          fi
          node scripts/e2e-shards.ts record "$TIMINGS" "${reports[@]}"
          echo "recorded=true" >> "$GITHUB_OUTPUT"
      - if: steps.merge.outputs.recorded == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e-timings.json
          key: e2e-timings-${{ github.run_id }}
