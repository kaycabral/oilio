# Ephemeral Postgres for the integration suites (`pnpm test:integration`,
# `pnpm test:integration:events`): native constraints, RLS and the
# event store proved against a real database, never a mock. No named volume, so
# every run starts empty. The runners in scripts/ bring it up and tear it down.
# Dev, seed and E2E use the local Supabase stack instead (supabase/).

services:
  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-produtos}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    # Capped like the test battery (memory: heavy tests via capped docker) so a
    # runaway query can't swap-thrash the host. Postgres is light; 1 GB is plenty.
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
